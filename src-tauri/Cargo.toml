[package]
name = "glaukopis"
description = "A hub for scholarly work: references, ideas, writing"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "glaukopis_app"
path = "src/lib.rs"

[[bin]]
name = "glaukopis"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
glaukopis-core = { path = "../crates/core", default-features = false }
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["embedded-fonts"]
# Serve the built interface from inside the executable instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]
# The fonts that come with Typst, compiled in: the installers for Windows
# and macOS keep them; the package for Linux is built without, and depends
# on the packages of the fonts.
embedded-fonts = ["glaukopis-core/embedded-fonts"]
# SQLite compiled in, where the system has none to link to: Windows, macOS.
bundled-sqlite = ["glaukopis-core/bundled-sqlite"]

[dev-dependencies]
tempfile.workspace = true
