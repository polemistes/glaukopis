# Installers for Windows and macOS, and packages for Debian, Ubuntu and
# Fedora, made on GitHub's machines, since macOS can only be built on a Mac.
# The installers are not signed: Windows asks once whether to run the
# installer; macOS needs the app to be opened with a right-click the first
# time (see docs/guide.md). All are kept as artifacts of the run, not
# published as a release.
#
# Pandoc and Tesseract come with the application, in resources/bin, where it
# looks for them after the settings and the path, Tesseract with the data it
# has of its own (English); and Typst is part of it (ADR 0023), with its
# fonts compiled in (the feature `embedded-fonts`, on unless turned off). On
# Arch these are packages of the system, which the application's package
# depends on or offers; Windows and macOS have no such packages to lean on,
# so the installers bring them. The deb and the rpm stand between: Pandoc
# comes along, since the Pandoc of Debian and Ubuntu is older than the
# application asks for, while Tesseract, which those systems have as new as
# any, and the dictionaries of English are recommended from their packages.
# The dictionaries of spelling and the data of Tesseract's other languages
# come with none: they are imported in the application (ADR 0032).

name: Installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            bundles: nsis,msi
          - os: macos-latest
            name: macos
            bundles: app,dmg
          - os: ubuntu-24.04
            name: linux
            bundles: deb,rpm
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install the interface's packages
        run: pnpm install --frozen-lockfile

      # What Tauri builds and bundles with on Linux, and what the tests of the
      # core run with.
      - name: The libraries and programs of the system, on Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            tesseract-ocr tesseract-ocr-eng poppler-utils fontconfig

      # ---- the programs that come with the application ----

      - name: Pandoc for Windows
        if: matrix.name == 'windows'
        run: |
          mkdir -p resources/bin/licenses work
          gh release download -R jgm/pandoc --pattern '*-windows-x86_64.zip' -D work
          7z x -owork/pandoc work/pandoc-*.zip > /dev/null
          cp work/pandoc/*/pandoc.exe resources/bin/
          cp work/pandoc/*/COPYRIGHT.txt resources/bin/licenses/pandoc-COPYRIGHT.txt

      - name: Tesseract for Windows
        if: matrix.name == 'windows'
        run: |
          gh release download -R UB-Mannheim/tesseract --pattern 'tesseract-ocr-w64-setup-*.exe' -D work
          7z x -oresources/bin/tesseract work/tesseract-ocr-w64-setup-*.exe > /dev/null
          rm -rf 'resources/bin/tesseract/$PLUGINSDIR' resources/bin/tesseract/*.nsis resources/bin/tesseract/uninstall*
          # Tesseract itself, its libraries and its data; not the tools for
          # training it, its manual or the viewer that needs Java.
          cd resources/bin/tesseract
          find . -maxdepth 1 -name '*.exe' ! -name 'tesseract.exe' -delete
          rm -rf ./*.html ./*.jar doc
          TESSDATA_PREFIX="$PWD/tessdata" ./tesseract.exe --list-langs

      - name: Pandoc for Linux
        if: matrix.name == 'linux'
        run: |
          mkdir -p resources/bin/licenses work
          gh release download -R jgm/pandoc --pattern '*-linux-amd64.tar.gz' -D work
          tar -xzf work/pandoc-*-linux-amd64.tar.gz -C work
          cp work/pandoc-*/bin/pandoc resources/bin/
          cp work/pandoc-*/share/doc/pandoc/COPYRIGHT* resources/bin/licenses/ 2>/dev/null || true
          resources/bin/pandoc --version | head -1
          # For the tests of the core as well.
          echo "$PWD/resources/bin" >> "$GITHUB_PATH"

      - name: Pandoc for macOS
        if: matrix.name == 'macos'
        run: |
          mkdir -p resources/bin/licenses work
          gh release download -R jgm/pandoc --pattern '*-arm64-macOS.zip' -D work
          unzip -q work/pandoc-*.zip -d work/pandoc
          cp work/pandoc/*/bin/pandoc resources/bin/
          cp work/pandoc/*/share/doc/pandoc/COPYRIGHT* resources/bin/licenses/ 2>/dev/null || true

      # Homebrew's Tesseract, with the libraries it needs copied beside it and
      # pointed to there, so that it runs on a Mac without Homebrew; and its
      # folder of data whole: English, and the configurations and the font it
      # makes PDFs and TSV with.
      - name: Tesseract for macOS
        if: matrix.name == 'macos'
        continue-on-error: true
        run: |
          brew install tesseract dylibbundler
          mkdir -p resources/bin/tesseract/tessdata
          cp "$(brew --prefix tesseract)/bin/tesseract" resources/bin/tesseract/
          chmod u+w resources/bin/tesseract/tesseract
          dylibbundler -od -b -x resources/bin/tesseract/tesseract -d resources/bin/tesseract/libs -p @executable_path/libs/
          for f in resources/bin/tesseract/tesseract resources/bin/tesseract/libs/*; do codesign --force -s - "$f"; done
          cp -RL "$(brew --prefix tesseract)/share/tessdata/." resources/bin/tesseract/tessdata/
          resources/bin/tesseract/tesseract --version
          TESSDATA_PREFIX="$PWD/resources/bin/tesseract/tessdata" resources/bin/tesseract/tesseract --list-langs

      # ---- the application ----

      - name: Build the installers
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --features bundled-sqlite

      - uses: actions/upload-artifact@v4
        with:
          name: glaukopis-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm

      # After the installers are kept, so that a test that fails on one
      # system marks the run without losing them.
      - name: Test the core
        run: cargo test -p glaukopis-core --features bundled-sqlite
