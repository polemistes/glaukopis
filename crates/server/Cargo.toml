[package]
name = "glaukopis-server"
description = "The collaboration server of Glaukopis"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "glaukopis-server"
path = "src/main.rs"

[lib]
name = "glaukopis_server"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# With `sync`, what belongs to a document may pass between threads.
yrs = { version = "0.28", features = ["sync"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
uuid.workspace = true
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite = "0.30"
ureq = { version = "3", default-features = false, features = ["json"] }
