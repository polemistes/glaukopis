[package]
name = "glaukopis-core"
description = "The data and document core of Glaukopis"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
tracing.workspace = true
tempfile.workspace = true
unicode-normalization = "0.1"
sha2 = "0.10"
strsim = "0.11"
base64 = "0.22"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip", "json"] }
roxmltree = "0.21"
rusqlite = { version = "0.40" }
zip = { version = "8", default-features = false, features = ["deflate"] }
pdf-extract = "0.12"
# The same as pdf-extract reads with, without what is not needed here.
lopdf = { version = "0.42", default-features = false }
hayro = "0.7.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
calamine = "0.36"
encoding_rs = "0.8"
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"

[features]
# Compile SQLite in, where the system has none to link to.
bundled-sqlite = ["rusqlite/bundled"]

[dev-dependencies]
