[package]
name = "glaukopis-core"
description = "The data and document core of Glaukopis"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
# The depth of Pandoc's JSON is bounded by the core, not by the parser's 128 levels.
serde_json = { workspace = true, features = ["unbounded_depth"] }
uuid.workspace = true
time.workspace = true
tracing.workspace = true
tempfile.workspace = true
unicode-normalization = "0.1"
sha2 = "0.10"
strsim = "0.11"
base64 = "0.22"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip", "json"] }
roxmltree = "0.21"
rusqlite = { version = "0.40" }
zip = { version = "8", default-features = false, features = ["deflate"] }
pdf-text = { path = "../pdf-text" }
# How far a page's content unpacks, counted without unpacking it all.
flate2 = "1"

# The same as pdf-text (pdf-extract) reads with, without what is not needed here.
lopdf = { version = "0.42", default-features = false }
hayro = "0.7.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
calamine = "0.36"
encoding_rs = "0.8"
fluent-bundle = "0.16"
# The parser fluent-bundle reads with, and the plural rules it says by: for
# checking own words before they are laid over the words built in (ADR 0035).
fluent-syntax = "0.12"
intl_pluralrules = "7"
unic-langid = "0.9"
sys-locale = "0.3"
spellbook = "0.4"
icu_properties = "2"
# Typst, within the application: the pages of the preview are set once and
# drawn as they are looked at, and the PDF is made by the same (ADR 0023).
typst = "0.15.1"
typst-svg = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["scan-fonts"] }
comemo = "0.5"

# Reading PDFs in a process of its own, within bounds (isolated.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
] }

[features]
default = ["embedded-fonts"]
# The fonts that come with Typst, compiled in: for Windows and macOS, where
# nothing installs fonts for the application. A package of Linux leaves them
# out and depends on the packages of the fonts instead.
embedded-fonts = ["typst-kit/embedded-fonts"]
# Compile SQLite in, where the system has none to link to.
bundled-sqlite = ["rusqlite/bundled"]

[dev-dependencies]
