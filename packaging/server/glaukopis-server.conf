# Settings of the Glaukopis collaboration server. Read by the service when it
# starts; after a change: systemctl restart glaukopis-server

# The address and port to listen on. The server does not encrypt what it
# sends: keep it on this computer, and put a proxy that does in front of it
# (see /usr/share/doc/glaukopis-server/Caddyfile.example).
GLAUKOPIS_SERVER_LISTEN=127.0.0.1:8375

# A password asked of those who publish projects on the server. Those who
# join a project by a code need none. The server does not start without one
# when it can be reached from beyond this computer, as behind a proxy, unless
# GLAUKOPIS_SERVER_OPEN below says that anyone may publish on it.
#GLAUKOPIS_SERVER_PASSWORD=

# Behind a proxy: take the addresses of callers from what the proxy says.
GLAUKOPIS_SERVER_TRUST_PROXY=true

# The most projects the server will hold.
#GLAUKOPIS_SERVER_MAX_ROOMS=200

# The most one figure of a project may hold, and the most the figures of one
# project may hold together, in megabytes.
#GLAUKOPIS_SERVER_MAX_FILE_MB=50
#GLAUKOPIS_SERVER_MAX_ROOM_MB=1024

# The most one project may hold, without its figures, in megabytes.
#GLAUKOPIS_SERVER_MAX_PROJECT_MB=64

# Let anyone who can reach the server publish projects on it, with no password.
#GLAUKOPIS_SERVER_OPEN=true
